name: Class Reminder

on:
  schedule:
    # 毎日 21:00 JST（UTC 12:00）
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Notify if class is tomorrow
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const fs = require("fs");

            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed("DISCORD_WEBHOOK_URL is not set");
              return;
            }

            // ===== データ読み込み =====
            const classes = JSON.parse(
              fs.readFileSync("data/classes.json", "utf8")
            );
            const taunts = JSON.parse(
              fs.readFileSync("data/taunts.json", "utf8")
            );

            // ===== 日付計算 =====
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(now.getDate() + 1);

            const yyyy = tomorrow.getFullYear();
            const mm = String(tomorrow.getMonth() + 1).padStart(2, "0");
            const dd = String(tomorrow.getDate()).padStart(2, "0");
            const tomorrowStr = `${yyyy}-${mm}-${dd}`;

            const target = classes.find(c => c.date === tomorrowStr);
            if (!target) {
              console.log("No class tomorrow");
              return;
            }

            // ===== Issue取得 =====
            const issues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: "open",
                per_page: 100
              }
            );

            const issueList =
              issues.length > 0
                ? issues.map(i => `- #${i.number} ${i.title}`).join("\n")
                : "特になし";

            const taunt = taunts[Math.floor(Math.random() * taunts.length)];
            const repoUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}`;

            // ===== 授業メッセージ（テキスト）=====
            const messageText = `📚 明日は授業日です
            
            【今日アレッシオの楽しいNext.js】
            
            🗓 日付：${target.date}
            ⏰ 時間：${target.time}
            
            📝 関連 Issue
            ${issueList}
            
            🔗 GitHub
            ${repoUrl}
            
            ${taunt}`;

            // ===== 天気API（ノルウェー気象庁 met.no）=====
            const weatherRes = await fetch(
              "https://api.met.no/weatherapi/locationforecast/2.0/compact" +
              "?lat=34.6720&lon=135.5016",
              {
                headers: {
                  "User-Agent": "alessio-nextjs-class-reminder"
                }
              }
            );

            const weatherData = await weatherRes.json();

            const timeseries = weatherData.properties.timeseries;
            const weatherTarget = timeseries.find(t =>
              t.time.startsWith(tomorrowStr)
            );

            const symbol =
              weatherTarget.data.next_12_hours.summary.symbol_code;

            const temp =
              weatherTarget.data.instant.details.air_temperature;

            const iconUrl =
              `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/assets/weather/${symbol}.png`;

            // ===== Discord送信 =====
            await fetch(webhook, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                username: "Alessio Next.js Class",
                avatar_url: `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/assets/discord-icon.png`,
                content: messageText,
                embeds: [
                  {
                    title: "🌤 明日の心斎橋の天気",
                    description: `天気：${symbol.replace(/_/g, " ")}\n気温：${temp}℃`,
                    color: 0x00ADEF,
                    thumbnail: {
                      url: iconUrl
                    }
                  }
                ]
              })
            });
